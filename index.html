<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Achievement Management System</title>
</head>

<body>

    <h1>🏆 Student Achievement Management System</h1>

    <p>Manage and track student achievements easily</p>

    <h2>Add New Achievement</h2>

    <label>Student Name</label>
    <input type="text" id="studentName">

    <br><br>

    <label>Age</label>
    <input type="number" id="age">

    <br><br>

    <label>Date of Birth</label>
    <input type="date" id="dob">

    <br><br>

    <label>Achievement Name</label>
    <input type="text" id="achievementName">
    

    <br><br>

    <label>Category</label>
    <input type="text" id="category">

    <br><br>

    <label>Achievement Year</label>
    <input type="number">

    <br><br>

    <button onclick="saveAchievement()">Save Achievement</button>

    <h2>Search Achievement</h2>

    <input type="text" placeholder="Search by student name...">

    <h2>Saved Achievements</h2>

<table border="1">
    <thead>
        <tr>
            <th>Student Name</th>
            <th>Age</th>
            <th>Date of Birth</th>
            <th>Achievement</th>
            <th>Category</th>
            <th>Year</th>
        </tr>
    </thead>

    <tbody id="achievementTable">
    </tbody>
</table>
    <script src="script.js"></script>
</body>
</html>
